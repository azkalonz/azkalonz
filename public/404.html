<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" />
    <title>Page not found | BuiltByMark.dev</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #eeeee8;
        --paper: #f8f7f1;
        --ink: #17211f;
        --muted: #596460;
        --line: #c7cbc4;
        --relay: #b84421;
        --relay-ink: #fffaf3;
        font-family: Arial, Helvetica, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100svh;
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
      }
      main {
        width: min(calc(100% - 2rem), 70rem);
        margin-inline: auto;
        padding-block: clamp(1.5rem, 4vw, 3rem) clamp(4rem, 10vw, 8rem);
      }
      .brand {
        display: inline-block;
        color: var(--ink);
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
      }
      h1 {
        max-width: 14ch;
        margin: clamp(4rem, 12vw, 9rem) 0 0;
        font-size: clamp(2.25rem, 5vw, 3.25rem);
        line-height: 1.02;
        letter-spacing: -0.025em;
      }
      p {
        max-width: 36rem;
        margin: 1.5rem 0 0;
        color: var(--muted);
        line-height: 1.65;
      }
      .action {
        display: inline-block;
        min-height: 3.25rem;
        margin-top: 2rem;
        border-radius: 0.2rem;
        background: var(--relay);
        color: var(--relay-ink);
        padding: 0.85rem 1.15rem;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #1e67bf;
        outline-offset: 3px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --canvas: #131917;
          --paper: #1a211e;
          --ink: #eeece4;
          --muted: #a7b0ab;
          --line: #39423d;
          --relay: #ff7a45;
          --relay-ink: #171d1a;
        }
        a:focus-visible {
          outline-color: #f4b45f;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">BuiltByMark.dev</a>
      <h1>This page isn’t available.</h1>
      <p>
        The link may be outdated, or the page may have moved. Return home to see
        services and work.
      </p>
      <a class="action" href="/">Return home</a>
    </main>
  </body>
</html>
