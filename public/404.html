<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" />
    <title>Page not found | BuiltByMark.dev</title>
    <!-- applied-theme-font:start -->
    <!-- applied-theme-font:end -->
    <style>
      @font-face {
        font-family: "Profile Manrope";
        src: url("/profile/fonts/manrope-400.ttf") format("truetype");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Profile Manrope";
        src: url("/profile/fonts/manrope-600.ttf") format("truetype");
        font-weight: 500 700;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        /* applied-theme-light:start */
        --canvas: #f2f3f5;
        --paper: #ffffff;
        --ink: #171b20;
        --muted: #555f6b;
        --line: #d4d9df;
        --relay: #242a32;
        --relay-ink: #f0f2f5;
        --focus: #3a414a;
        --font-body:
          "Profile Manrope", "Manrope", "Segoe UI", ui-sans-serif, system-ui,
          sans-serif;
        --font-display:
          "Profile Manrope", "Manrope", "Segoe UI", ui-sans-serif, system-ui,
          sans-serif;
        --body-weight: 400;
        --body-leading: 1.7;
        --body-tracking: 0;
        --display-weight: 600;
        --display-tracking: -0.025em;
        --display-transform: none;
        --display-style: normal;
        --h1-leading: 1.12;
        --control-weight: 500;
        --control-tracking: 0;
        /* applied-theme-light:end */
        font-family: var(--font-body);
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100svh;
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-weight: var(--body-weight);
        letter-spacing: var(--body-tracking);
        line-height: var(--body-leading);
      }
      main {
        width: min(calc(100% - 2rem), 70rem);
        margin-inline: auto;
        padding-block: clamp(1.5rem, 4vw, 3rem) clamp(4rem, 10vw, 8rem);
      }
      .brand {
        display: inline-block;
        color: var(--ink);
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
      }
      h1 {
        max-width: 14ch;
        margin: clamp(4rem, 12vw, 9rem) 0 0;
        font-family: var(--font-display);
        font-size: clamp(2.25rem, 5vw, 3.25rem);
        font-style: var(--display-style);
        font-weight: var(--display-weight);
        letter-spacing: var(--display-tracking);
        line-height: var(--h1-leading);
        text-transform: var(--display-transform);
      }
      p {
        max-width: 36rem;
        margin: 1.5rem 0 0;
        color: var(--muted);
        line-height: var(--body-leading);
      }
      .action {
        display: inline-block;
        min-height: 3.25rem;
        margin-top: 2rem;
        border-radius: 0.625rem;
        background: var(--relay);
        color: var(--relay-ink);
        padding: 0.85rem 1.15rem;
        font-weight: var(--control-weight);
        letter-spacing: var(--control-tracking);
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      @media all {
        :root {
          color-scheme: dark;
          /* applied-theme-dark:start */
          --canvas: #171b20;
          --paper: #242a32;
          --ink: #f0f2f5;
          --muted: #bcc4ce;
          --line: #3a414a;
          --relay: #f0f2f5;
          --relay-ink: #171b20;
          --focus: #cbd7e8;
          /* applied-theme-dark:end */
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">BuiltByMark.dev</a>
      <h1>This page isn’t available.</h1>
      <p>
        The link may be outdated, or the page may have moved. Return home to
        find the right link.
      </p>
      <a class="action" href="/">Return home</a>
    </main>
  </body>
</html>
