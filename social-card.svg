<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">I Build Systems That Automate The Work — Mark Judaya</title>
  <desc id="description">Mark Judaya, full-stack developer and systems specialist.</desc>

  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1d3a2c" stroke-width="1"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#000" stroke-opacity=".22"/>
    </pattern>
    <radialGradient id="glow" cx="80%" cy="44%" r="55%">
      <stop offset="0" stop-color="#173b2a"/>
      <stop offset=".55" stop-color="#08110d" stop-opacity=".4"/>
      <stop offset="1" stop-color="#050806" stop-opacity="0"/>
    </radialGradient>
    <filter id="green-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#050806"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".58"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <path d="M24 80H1176M24 550H1176" stroke="#1d3a2c"/>
  <path d="M24 80H260M940 80H1176M24 550H330M990 550H1176" stroke="#3d7455"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="42" y="51" fill="#86a893" font-size="15" letter-spacing="2.5">SYS.01 // BUILTBYMARK.DEV</text>
    <circle cx="1024" cy="45" r="5" fill="#63ff9b" filter="url(#green-glow)"/>
    <text x="1040" y="51" fill="#b8ffd0" font-size="15" letter-spacing="2.5">ONLINE</text>

    <text x="54" y="128" fill="#ffc857" font-size="18" font-weight="700">&gt;_</text>
    <text x="92" y="128" fill="#63ff9b" font-size="18" font-weight="700" letter-spacing="2">MARK JUDAYA // SYSTEMS DEVELOPER</text>

    <text x="52" y="225" fill="#edf8f0" font-size="70" font-weight="800" letter-spacing="-3">I BUILD SYSTEMS</text>
    <text x="52" y="310" fill="#edf8f0" font-size="70" font-weight="800" letter-spacing="-3">THAT </text>
    <text x="250" y="310" fill="#63ff9b" font-size="70" font-weight="800" letter-spacing="-3" filter="url(#green-glow)">AUTOMATE</text>
    <text x="52" y="395" fill="#edf8f0" font-size="70" font-weight="800" letter-spacing="-3">THE WORK.</text>

    <g transform="translate(54 448)">
      <rect width="274" height="54" fill="#08110d" stroke="#3d7455"/>
      <rect x="300" width="274" height="54" fill="#08110d" stroke="#63ff9b"/>
      <rect x="600" width="274" height="54" fill="#08110d" stroke="#3d7455"/>

      <rect x="18" y="23" width="8" height="8" fill="none" stroke="#63ff9b"/>
      <text x="42" y="34" fill="#b8ffd0" font-size="15" font-weight="700" letter-spacing="2">INPUT</text>

      <circle cx="321" cy="27" r="5" fill="#63ff9b" filter="url(#green-glow)"/>
      <text x="341" y="34" fill="#63ff9b" font-size="15" font-weight="700" letter-spacing="2">AUTOMATE</text>

      <rect x="618" y="23" width="8" height="8" fill="#63ff9b"/>
      <text x="642" y="34" fill="#b8ffd0" font-size="15" font-weight="700" letter-spacing="2">OUTPUT</text>

      <path d="M274 27H300M574 27H600" stroke="#63ff9b" stroke-dasharray="3 5"/>
    </g>

    <text x="42" y="588" fill="#63ff9b" font-size="16">mark@systems:~$</text>
    <text x="218" y="588" fill="#86a893" font-size="16">orchestrate --reliable --maintainable</text>
    <rect x="577" y="574" width="9" height="18" fill="#63ff9b"/>

    <g transform="translate(1068 555) scale(.82)" fill="none" stroke="#63ff9b" stroke-linejoin="round">
      <path d="M32 5 55 18v26L32 58 9 44V18L32 5Z" stroke-width="2.5"/>
      <path d="M15 43V20l17 11 17-11v20c0 8-5 13-13 13-5 0-9-2-12-6" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M32 31v20" stroke-width="3.5" stroke-linecap="round"/>
      <g fill="#050806" stroke-width="2.5">
        <circle cx="32" cy="5" r="3.5"/>
        <circle cx="55" cy="18" r="3.5"/>
        <circle cx="55" cy="44" r="3.5"/>
        <circle cx="32" cy="58" r="3.5"/>
        <circle cx="9" cy="44" r="3.5"/>
        <circle cx="9" cy="18" r="3.5"/>
      </g>
    </g>
  </g>

  <rect width="1200" height="630" fill="url(#scanlines)" pointer-events="none"/>
  <rect x="12" y="12" width="1176" height="606" fill="none" stroke="#1d3a2c"/>
</svg>
