<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Mark Judaya — Full-stack developer and systems specialist</title>
  <desc id="desc">A dark matrix-grid interface introducing Mark Judaya and his work in custom applications, automation, and systems integration.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#63ff9b" stroke-opacity=".075"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1712"/>
      <stop offset="1" stop-color="#050806"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="18" fill="url(#fade)"/>
  <rect width="1200" height="430" rx="18" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="429" rx="17.5" fill="none" stroke="#3d7455"/>
  <path d="M0 76H1200M0 367H1200" stroke="#1d3a2c"/>

  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
    <text x="46" y="47" fill="#86a893" font-size="13" letter-spacing="2.2">PROFILE_STREAM // 01</text>
    <circle cx="1012" cy="42" r="5" fill="#63ff9b" filter="url(#glow)"/>
    <text x="1028" y="47" fill="#63ff9b" font-size="13" letter-spacing="2">ONLINE</text>
    <text x="46" y="129" fill="#b8ffd0" font-size="16" letter-spacing="3">&gt;_ MARK JUDAYA // SYSTEMS DEVELOPER</text>

    <text x="46" y="205" fill="#edf8f0" font-size="58" font-weight="700" letter-spacing="-2">I BUILD SYSTEMS</text>
    <text x="46" y="269" fill="#edf8f0" font-size="58" font-weight="700" letter-spacing="-2">THAT <tspan fill="#63ff9b">AUTOMATE</tspan> THE WORK.</text>

    <text x="48" y="316" fill="#a9c2b1" font-size="16">Custom applications · business automation · reliable integrations</text>

    <text x="47" y="402" fill="#63ff9b" font-size="14">mark@systems:~$</text>
    <text x="195" y="402" fill="#86a893" font-size="14">orchestrate --reliable --maintainable</text>
    <rect x="533" y="387" width="9" height="19" fill="#63ff9b"/>
  </g>

  <g transform="translate(890 108)" fill="none" stroke="#3d7455">
    <rect width="250" height="203" stroke="#1d3a2c" fill="#08110d" fill-opacity=".78"/>
    <path d="M40 42H118M132 42H210M40 102H95M108 102H210M40 162H133M146 162H210" stroke-dasharray="3 7"/>
    <g fill="#050806" stroke="#63ff9b">
      <rect x="25" y="29" width="16" height="16"/>
      <rect x="117" y="29" width="16" height="16"/>
      <rect x="209" y="29" width="16" height="16"/>
      <rect x="25" y="89" width="16" height="16"/>
      <rect x="94" y="89" width="16" height="16"/>
      <rect x="209" y="89" width="16" height="16"/>
      <rect x="25" y="149" width="16" height="16"/>
      <rect x="132" y="149" width="16" height="16"/>
      <rect x="209" y="149" width="16" height="16"/>
    </g>
    <g fill="#86a893" stroke="none" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="1.3">
      <text x="25" y="20">INPUT</text>
      <text x="102" y="80">AUTOMATE</text>
      <text x="193" y="140">OUTPUT</text>
    </g>
  </g>
</svg>
