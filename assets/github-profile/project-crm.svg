<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-labelledby="title desc">
  <title id="title">Salesforce to Zoho CRM Migration</title>
  <desc id="desc">A staged migration of more than 220,000 CRM records with relationship preservation and validation.</desc>
  <rect width="580" height="250" rx="14" fill="#08110d"/>
  <rect x=".5" y=".5" width="579" height="249" rx="13.5" fill="none" stroke="#3d7455"/>
  <path d="M0 48H580" stroke="#1d3a2c"/>
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
    <text x="22" y="30" fill="#63e6ff" font-size="11" letter-spacing="1.8">CASE_02 // DATA MIGRATION</text>
    <text x="22" y="85" fill="#edf8f0" font-size="22" font-weight="700">SALESFORCE → ZOHO CRM</text>
    <text x="22" y="118" fill="#a9c2b1" font-size="12">220,000+ records moved with relationships,</text>
    <text x="22" y="139" fill="#a9c2b1" font-size="12">record IDs, traceability, and continuity.</text>
    <text x="22" y="184" fill="#86a893" font-size="10">ZOHO CRM · SALESFORCE · CSV · DELUGE</text>
    <text x="22" y="222" fill="#63ff9b" font-size="11">OPEN CASE STUDY  →</text>
  </g>
</svg>
