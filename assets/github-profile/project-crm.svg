<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-labelledby="title desc">
  <title id="title">Salesforce to Zoho CRM Migration</title>
  <desc id="desc">More than 2 million records migrated with relationships and traceability preserved.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      [fill="#f8f7f1"] { fill:#1a211e; } [fill="#17211f"] { fill:#eeece4; }
      [fill="#596460"] { fill:#a7b0ab; } [fill="#b84421"] { fill:#ff7a45; }
      [fill="#4b6a94"] { fill:#8eadd5; } [stroke="#c7cbc4"] { stroke:#39423d; }
