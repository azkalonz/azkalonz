<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mark Judaya technical toolkit</title>
  <desc id="desc">Technologies used across front end, back end, integrations, and operational platforms.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      [fill="#eeeee8"] { fill:#131917; } [fill="#17211f"] { fill:#eeece4; }
      [fill="#596460"] { fill:#a7b0ab; } [fill="#b84421"] { fill:#ff7a45; }
      [fill="#22695f"] { fill:#73c1b2; } [fill="#4b6a94"] { fill:#8eadd5; }
      [stroke="#c7cbc4"] { stroke:#39423d; }
    }
    text { font-family:"Source Sans 3 Variable","Segoe UI",Arial,sans-serif; }
  </style>
  <rect width="1200" height="360" fill="#eeeee8"/>
  <text x="44" y="52" fill="#17211f" font-size="29" font-weight="650" letter-spacing="-.5">Technical toolkit</text>
  <text x="1156" y="50" text-anchor="end" fill="#596460" font-size="15">Technology supports the workflow—not the other way around</text>
  <path d="M44 78H1156M44 214H1156M600 106V322" stroke="#c7cbc4"/>
  <g transform="translate(44 113)">
    <text y="20" fill="#b84421" font-size="16" font-weight="700">Front end</text>
    <text y="56" fill="#17211f" font-size="18">React · TypeScript · Inertia · Tailwind CSS</text>
    <text y="84" fill="#596460" font-size="14">Responsive interfaces and maintainable product UI</text>
  </g>
  <g transform="translate(628 113)">
    <text y="20" fill="#22695f" font-size="16" font-weight="700">Back end &amp; data</text>
    <text y="56" fill="#17211f" font-size="18">Laravel · PHP · Node.js · PostgreSQL · Redis</text>
    <text y="84" fill="#596460" font-size="14">APIs, data models, services, and background jobs</text>
  </g>
  <g transform="translate(44 249)">
    <text y="20" fill="#4b6a94" font-size="16" font-weight="700">Automation &amp; integration</text>
    <text y="56" fill="#17211f" font-size="18">REST APIs · Webhooks · n8n · CSV pipelines</text>
    <text y="84" fill="#596460" font-size="14">Validation, migration, syncing, logging, and recovery</text>
  </g>
  <g transform="translate(628 249)">
    <text y="20" fill="#17211f" font-size="16" font-weight="700">Business platforms</text>
    <text y="56" fill="#17211f" font-size="18">Zoho · Salesforce · Mirakl · ERP workflows</text>
    <text y="84" fill="#596460" font-size="14">Connected systems for customers, products, and orders</text>
  </g>
