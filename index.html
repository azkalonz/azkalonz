<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("has-brand-motion");
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="description"
      content="Mark Judaya builds custom business software, integrations, and automation for teams managing orders, inventory, CRM, and product data."
    />
    <meta name="author" content="Mark Judaya" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="theme-color" content="#eeeee8" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BuiltByMark.dev" />
    <meta
      property="og:title"
      content="Custom Software, Integrations & Support | BuiltByMark.dev"
    />
    <meta
      property="og:description"
      content="Custom business software, Zoho and API integrations, automation, and support from Mark Judaya."
    />
    <meta property="og:url" content="https://builtbymark.dev" />
    <meta
      property="og:image"
      content="https://builtbymark.dev/social-card.png"
    />
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-GE3XEC3BD0");

      (function () {
        var loaded = false;
        var events = ["pointerdown", "keydown", "scroll"];
        var loadAnalytics = function () {
          if (loaded) return;
          loaded = true;
          events.forEach(function (eventName) {
            window.removeEventListener(eventName, loadAnalytics);
          });

          var script = document.createElement("script");
          script.async = true;
          script.src =
            "https://www.googletagmanager.com/gtag/js?id=G-GE3XEC3BD0";
          document.head.appendChild(script);
        };

        events.forEach(function (eventName) {
          window.addEventListener(eventName, loadAnalytics, {
            once: true,
            passive: true,
          });
        });
        window.addEventListener("load", function () {
          window.setTimeout(loadAnalytics, 4000);
        });
      })();
    </script>
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("theme");
          var dark =
            storedTheme === "dark" ||
            (!storedTheme &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.documentElement.style.backgroundColor = dark
            ? "#131917"
            : "#eeeee8";
        } catch (error) {
          document.documentElement.style.backgroundColor = "#eeeee8";
        }
      })();
    </script>
    <title>Custom Software, Integrations & Support | BuiltByMark.dev</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
