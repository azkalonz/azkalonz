    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-GE3XEC3BD0");

      (function () {
        var loaded = false;
        var events = ["pointerdown", "keydown", "scroll"];
        var loadAnalytics = function () {
          if (loaded) return;
          loaded = true;
          events.forEach(function (eventName) {
            window.removeEventListener(eventName, loadAnalytics);
          });

          var script = document.createElement("script");
          script.async = true;
          script.src =
            "https://www.googletagmanager.com/gtag/js?id=G-GE3XEC3BD0";
          document.head.appendChild(script);
        };

        events.forEach(function (eventName) {
          window.addEventListener(eventName, loadAnalytics, {
            once: true,
            passive: true,
          });
        });
        window.addEventListener("load", function () {
          window.setTimeout(loadAnalytics, 4000);
        });
      })();
    </script>
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("theme");
          var dark =
            storedTheme === "dark" ||
            (!storedTheme &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = dark
            ? "#0e1513"
            : "#f5f4ef";
        } catch (error) {
          document.documentElement.style.backgroundColor = "#f5f4ef";
        }
      })();
    </script>
