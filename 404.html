<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" />
    <title>Page not found | Mark Judaya</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        background: #f5f4ef;
        color: #16211e;
      }
      main {
        width: min(100% - 2rem, 44rem);
      }
      span {
        color: #11695c;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 12ch;
        margin: 1rem 0;
        font:
          500 clamp(3rem, 10vw, 5rem)/1 Georgia,
          serif;
        letter-spacing: -0.05em;
      }
      p {
        max-width: 36rem;
        color: #5c6763;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        border-radius: 0.55rem;
        background: #11695c;
        color: white;
        padding: 0.8rem 1.15rem;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #d48b31;
        outline-offset: 3px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0e1513;
          color: #edf1ec;
        }
        p {
          color: #aab4b0;
        }
        span {
          color: #70bba9;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span>Error 404</span>
      <h1>This page is not here.</h1>
      <p>
        The link may be outdated, or the page may have moved. Return home to
        explore services and selected work.
      </p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
